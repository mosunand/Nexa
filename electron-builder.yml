appId: com.zhipucode.nexa
productName: Nexa
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - build/icon.ico
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Nexa-Setup-${version}.${ext}
  shortcutName: Nexa
